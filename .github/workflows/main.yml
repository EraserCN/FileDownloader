name: OnePlus Firmware Downloader Pro

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予权限才能创建 Release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Firmware from OnePlus
        run: |
          echo "Starting download..."
          # 使用 wget 下载，增加重试机制
          wget -c -t 10 "https://gauss-compota-c-sg.allawnofs.com/remove-ee6404c5da6de3f22189e3b485ae77af/g-10eab6008d5642cf42abd2aa41f847cb/component-ota/26/05/11/89940c15fa9a420b8aa3fe59966c137f.zip?sign=916d06f752de4f0e019797118dadd92d&t=6a0fc081&x-oss-signature=46juGPDZ5jzXq5Ya2W%2FKG2rRf16G55iMA%2FLsAxfYHzw%3D&x-oss-signature-version=OSS2&x-oss-expires=1779419017&x-oss-access-key-id=LTAI5t7LQqPWs3796pRv6Avx" -O firmware.zip
          echo "Download complete."

      - name: Calculate Original SHA256
        run: |
          # 记录原始文件的哈希值，方便你下载后对比
          sha256sum firmware.zip > sha256.txt
          cat sha256.txt

      - name: Split File into 1.5GB Chunks
        run: |
          # 针对 2.6GB 文件，切分为 firmware.zip.aa 和 firmware.zip.ab
          # 避免触发 GitHub Release 2GB 的上传限制
          split -b 1500M firmware.zip firmware.zip.
          ls -lh firmware.zip.*

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: OnePlus Firmware (2.6GB Split Pack)
          body: |
            ### 下载说明
            由于文件超过 2GB，已切分为两个分卷。
            请下载 **firmware.zip.aa** 和 **firmware.zip.ab** 后手动合并。
            
            **原始文件 SHA256:**
            $(cat sha256.txt)
          files: |
            firmware.zip.aa
            firmware.zip.ab
            sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
